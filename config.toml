# HAL-9000 configuration
#
# The speed of the Rust server and the rhythm of the Python environment are both computed from
# `speedup` and `decision_interval`: they stay synchronized whatever the chosen speed.

[simulation]
# Speed of the simulation compared to real time, to watch a model fly
# (server started with `uv run python -m hal9000.server`, evaluate --watch, display_ship2D).
# 1 = real time, 5 = an orbit of Mercury in ~10 s instead of ~50 s.
speedup = 5

# Simulated time between two decisions of the AI, in seconds. Must be the same to train and to replay
# a model. The server cuts the engines after 15 ticks (0.25 s) without a command: 0.2 s (12 ticks)
# leaves a margin if a command arrives late.
decision_interval = 0.2

[server]
websocket_url = "ws://127.0.0.1:3012"
# Directory of the Rust server (deep_learning branch), relative to the root of the project
path = "rust-server"

[training]
# Training on the Rust server (server started with `uv run python -m hal9000.server --train`):
# speed and number of ships trained in parallel on the same server.
# The faster, the more late steps (which last longer than decision_interval):
#   x25, 4 ships: 335 steps/s,  3% late steps
#   x25, 6 ships: 514 steps/s,  7%
#   x40, 4 ships: 434 steps/s, 17%
# The training prints a warning if Python cannot keep up.
speedup = 25
n_envs = 6
# Training on the numpy simulation (exact replica of the server physics, no server):
# number of ships simulated in parallel
sim_envs = 64
# Maximum duration of an episode, in simulated minutes
episode_time = 10
# Total number of training steps, and checkpoint frequency
total_timesteps = 20_000_000
save_every = 1_000_000

[reward]
# Reward of the Hal9000_2D task (hal9000/model/Hal9000_2D.py)
target_reward = 10.0
death_penalty = 10.0
# Distance covered toward the target that earns +1
shaping_scale = 1000.0

[ppo]
learning_rate = 3e-4
# Number of steps collected (all ships together) before each update
rollout_size = 16384
batch_size = 2048
n_epochs = 10
# Horizon of about 1 / (1 - gamma) = 200 decisions, i.e. 40 simulated seconds
gamma = 0.995
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.005
net_arch = [128, 128]
