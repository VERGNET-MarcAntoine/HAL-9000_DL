[project]
name = "hal9000"
version = "1.0.0"
description = "Autopilot trained with reinforcement learning for Outer Wilds Web"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.0,<2",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "stable-baselines3>=2.5,<3",
    "tensorboard>=2.19",
    "torch>=2.13",
    "websocket-client>=1.8",
    # Minimum versions of transitive dependencies (security fixes)
    "pillow>=12.3",
    "protobuf>=6.31.1",
    "werkzeug>=3.1.6",
]

[tool.uv]
# Scripts project (run with `uv run python -m ...`), not a library to distribute
package = false
# Python managed by uv rather than the system one: it includes tkinter, needed by the
# matplotlib display (display_ship2D), without installing anything on the system
python-preference = "only-managed"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
exclude = [".venv", "rust-server", "logs", "models"]
